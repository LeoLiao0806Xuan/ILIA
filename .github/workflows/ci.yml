name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix apps/desktop
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Verify retrieval database
        shell: pwsh
        run: |
          $database = "data/ilia_prototype.sqlite3"
          if (-not (Test-Path -LiteralPath $database)) {
            throw "Required retrieval database is missing: $database"
          }
          $size = (Get-Item -LiteralPath $database).Length
          if ($size -lt 1MB) {
            throw "Retrieval database is unexpectedly small: $size bytes"
          }
      - name: Rust tests
        run: cargo test --workspace
      - name: Frontend build
        run: npm run build --prefix apps/desktop
